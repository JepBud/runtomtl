function newRun(leg, runner, start, estimateTo, prevId, partner) {
  const base = { leg, runner, start, end: null, km: null, legDone: false, prevId: prevId || null };
  if (partner && partner !== runner && !estimateTo) base.partner = partner;
  return estimateTo && estimateTo >= leg ? { ...base, kind: 'block', endLeg: estimateTo } : base;
}
function parseHMS(s) {
  const p = String(s || '').trim().split(':').map(Number);
  if (!p.length || p.some(isNaN)) return null;
  return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : null;
}

async function confirmSheet() {
  const st = sheetState; if (!st) return;
  const P = C.project(D(), Date.now());
  const at = Date.now() - (Number(st.ago) || 0) * 60000;
  const a = P.active;
  if (st.kind === 'handoff' || st.kind === 'split') {
    if (!a) return closeSheet();
    const aLeg = a.block ? a.endLeg : a.leg;
    const isLast = aLeg === S.legs.length, isFerry = Number(S.cfg.ferryLeg) === aLeg;
    const end = Math.max(at, a.start + 1000);
    const km = Number(st.km) || 0;
    const nb = C.blockOf(P.blocks, aLeg + 1);
    closeSheet();
    await save(async () => {
      await api.upd('runs', a.id, a.block ? { end, legDone: true } : { end, km, legDone: st.kind === 'handoff' });
      const partner = st.pair ? st.partner : null;
      if (st.kind === 'split') await api.add('runs', newRun(a.leg, st.runner, end, null, a.id, partner));
      else if (!isLast && !isFerry) await api.add('runs', newRun(aLeg + 1, st.runner, end, st.estimate && nb ? nb.end : null, a.id, partner));
    }, st.kind === 'split' ? `${runnerName(st.runner)} takes over` : isLast ? 'Finished!' : isFerry ? 'At the ferry' : `${runnerName(st.runner)} is off on Leg ${aLeg + 1}${st.estimate ? ' · estimating the block' : ''}`);
  } else if (st.kind === 'checkin') {
    if (!a || !a.block) return closeSheet();
    const L = Number(st.leg);
    const t0 = Math.max(at, a.start + 1000);
    closeSheet();
    await save(async () => {
      if (L === a.leg) await api.upd('runs', a.id, st.live ? { kind: null, endLeg: null, runner: st.runner } : { runner: st.runner });
      else {
        await api.upd('runs', a.id, { endLeg: L - 1, end: t0, legDone: true });
        await api.add('runs', newRun(L, st.runner, t0, st.live ? null : a.endLeg, a.id));
      }
    }, `Updated: ${runnerName(st.runner)} on Leg ${L}`);
  } else if (st.kind === 'fill') {
    const r = st.run;
    const legKm = n => (legOf(n) || {}).km || 0;
    const secs = st.rows.map(x => parseHMS(x.moving) || (Number(x.km) || legKm(x.leg)) * C.paceFor(x.runner, D()));
    const total = secs.reduce((p, q) => p + q, 0) * 1000;
    const gap = st.ferry ? (Number(S.cfg.ferryGapMin) || 21) * 60000 : 0;
    const k = total > 0 ? Math.max(0.2, (r.end - r.start - gap) / total) : 1;
    const fl = Number(S.cfg.ferryLeg) || 0;
    let t = r.start;
    const out = st.rows.map((x, i) => {
      const dur = secs[i] * 1000 * k;
      const lastOfLeg = !st.rows.slice(i + 1).some(y => y.leg === x.leg);
      const mv = parseHMS(x.moving);
      const run = { leg: x.leg, runner: x.runner, start: Math.round(t), end: Math.round(t + dur), km: Number(x.km) || null, actualKm: mv && x.km ? Number(x.km) : null, movingSec: mv || null, legDone: lastOfLeg, note: 'From Strava, times spread across the block' };
      t += dur;
      if (lastOfLeg && x.leg === fl && st.ferry) t += gap;
      return run;
    });
    closeSheet();
    await save(async () => { for (const x of out) await api.add('runs', x); await api.del('runs', r.id); }, `Saved ${out.length} runs`);
  } else if (st.kind === 'start') {
    if (a) return closeSheet();
    const last = S.runs.reduce((x, r) => (!x || (r.end || 0) > (x.end || 0) ? r : x), null);
    closeSheet();
    const nb = C.blockOf(P.blocks, st.leg);
    await save(() => api.add('runs', newRun(st.leg, st.runner, at, st.estimate && nb ? nb.end : null, last ? last.id : null, st.pair ? st.partner : null)), `${runnerName(st.runner)} is off on Leg ${st.leg}`);
  } else if (st.kind === 'pause') {
    if (!a) return closeSheet();
    closeSheet();
    await save(() => api.upd('runs', a.id, { end: Math.max(at, a.start + 1000), km: Number(st.km) || 0, legDone: !!st.legDone }), 'Race paused');
  } else if (st.kind === 'edit') {
    const r = st.run;
    const data = {
      leg: Math.max(1, Math.min(S.legs.length, parseInt(r.leg, 10) || 1)), runner: r.runner, partner: r.partner && r.partner !== r.runner ? r.partner : null,
      start: fromLocalInput(r.startS), end: fromLocalInput(r.endS),
      km: r.km === '' || r.km == null ? null : Number(r.km), actualKm: r.actualKm === '' || r.actualKm == null ? null : Number(r.actualKm),
      movingSec: parseHMS(r.moving), legDone: !!r.legDone, note: r.note || '',
    };
    if (!data.start) return toast('Add a start time.');
    if (data.end && data.end <= data.start) return toast('End has to be after start.');
    if (!data.end && S.runs.some(x => !x.end && x.id !== r.id)) return toast('Another runner is already on course. Give this run an end time.');
    closeSheet();
    await save(() => r.id ? api.upd('runs', r.id, data) : api.add('runs', data), 'Saved');
  } else if (st.kind === 'note') {
    const L = legOf(st.leg); if (!L) return closeSheet();
    const text = String(st.text || '').trim().slice(0, 1000);
    closeSheet();
    await save(() => api.upd('legs', L.id, { teamNote: text }), text ? 'Note saved' : 'Note deleted');
  } else if (st.kind === 'pin') {
    const pin = String(st.pin || '').trim();
    if (!pin) { st.err = 'Enter the PIN.'; return drawSheet(); }
    st.busy = true; st.err = ''; drawSheet();
    let ok = false;
    try { ok = await tryPin(pin); } catch (e) { st.busy = false; st.err = 'Could not check the PIN. Check your connection and try again.'; return drawSheet(); }
    if (!ok) { st.busy = false; st.err = 'That PIN is not right.'; st.pin = ''; return drawSheet(); }
    SB.pin = pin; S.canEdit = true;
    try { localStorage.setItem('rtm.pin', pin); } catch (e) {}
    closeSheet(); render(true); toast('Editing unlocked on this device');
  } else if (st.kind === 'reset') {
    closeSheet();
    await save(async () => { for (const r of [...S.runs]) await api.del('runs', r.id); }, 'All runs cleared');
  }
}

async function undo() {
  closeSheet();
  if (!S.runs.length) return;
  const latest = S.runs.reduce((x, r) => (!x || r.start > x.start ? r : x), null);
  const lastEnded = S.runs.filter(r => r.end).reduce((x, r) => (!x || r.end > x.end ? r : x), null);
  await save(async () => {
    if (latest.end && (!lastEnded || lastEnded.id === latest.id)) {
      await api.upd('runs', latest.id, { end: null, km: null, legDone: false });
    } else if (lastEnded && lastEnded.end > latest.start) {
      await api.upd('runs', lastEnded.id, { end: null, km: null, legDone: false });
    } else {
      await api.del('runs', latest.id);
      const prev = S.runs.find(r => r.id === latest.prevId) || lastEnded;
      if (prev && prev.end && Math.abs(prev.end - latest.start) < 2000) await api.upd('runs', prev.id, { end: null, km: null, legDone: false });
    }
  }, 'Undone');
}

async function copyText(t, okMsg) {
  try { await navigator.clipboard.writeText(t); toast(okMsg); }
  catch (err) {
    sheetState = { kind: 'copy' };
    $('#sheet').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><h3>Copy this</h3><textarea style="width:100%;height:40vh;font:13px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface-2);color:var(--ink)" readonly>${esc(t)}</textarea><div class="acts"><button class="btn quiet" data-act="close">Close</button></div></div></div>`;
    const ta = $('#sheet textarea'); ta.focus(); ta.select();
  }
}
function teamUpdate() {
  const now = Date.now(); const P = C.project(D(), now); const a = P.active; const N = S.legs.length;
  const lines = [`RunToMTL update · ${hm(now)}`];
  if (P.st[N] && P.st[N].s === 'done') { lines.push('We are finished! See you on Mont Royal.'); return lines.join('\n'); }
  if (a && a.block) {
    const pr = P.proj[a.curLeg], who = a.curLeg === a.leg && a.runner ? a.runner : (pr.runner || pr.suggested);
    lines.push(`Now (estimated): Leg ${a.curLeg} ${(legOf(a.curLeg) || {}).name || ''}${who ? ' · ' + runnerName(who) : ''} · done ~${hm(pr.end)}`);
  } else if (a) lines.push(`Now: Leg ${a.leg} ${(legOf(a.leg) || {}).name || ''} · ${runnerName(a.runner)} · arrives ~${hm(P.proj[a.leg].end)}`);
  else { const n = C.nextLeg(S.runs); if (P.proj[n]) lines.push(`Next: Leg ${n} ${(legOf(n) || {}).name || ''} · starts ~${hm(P.proj[n].start)}`); }
  { const cl = legOf(a ? (a.block ? a.curLeg : a.leg) : C.nextLeg(S.runs)); if (cl && cl.teamNote) lines.push(`Note for Leg ${cl.n}: ${cl.teamNote}`); }
  const cur = a ? (a.block ? a.curLeg : a.leg) : C.nextLeg(S.runs);
  const b = C.blockOf(P.blocks, cur);
  if (b && P.proj[b.end]) {
    const nb = P.blocks[b.i + 1];
    lines.push(`Next swap: end of Leg ${b.end} (${(legOf(b.end) || {}).exchange || ''}) ~${hm(P.proj[b.end].end)}${nb ? ` · ${blockNames(nb)} get ready` : ''}`);
    if (ferryMid(b, P)) lines.push(`RV: go to the ferry dock first, ~${hm(P.proj[Number(S.cfg.ferryLeg)].end)}`);
  }
  const fl = Number(S.cfg.ferryLeg) || 0;
  if (fl && P.proj[fl] && !P.proj[fl].actual) { const f = C.ferryAfter(P.proj[fl].end, S.cfg); lines.push(`Ferry: at the dock ~${hm(P.proj[fl].end)}${f.depart ? ` · ${hm(f.depart)} sailing, ${f.slackMin} min spare` : ''}`); }
  if (P.finish) lines.push(`Finish: ~${clock(P.finish)}`);
  return lines.join('\n');
}

// ---- events -----------------------------------------------------------------
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act], nav.tabs button');
  if (!el) return;
  if (el.matches('nav.tabs button')) { setTab(el.dataset.tab); return; }
  const act = el.dataset.act, v = el.dataset.v;
  const P = () => C.project(D(), Date.now());
  if (act === 'lock') return openSheet({ kind: 'pin', pin: '' });
  if (act === 'relock') { lockEditing(); return toast('Locked. This device is view only.'); }
  if (!S.canEdit && EDIT_ACTS.has(act)) return openSheet({ kind: 'pin', pin: '', err: '' });
  if (act === 'note') { const L = legOf(Number(v)); return openSheet({ kind: 'note', leg: Number(v), text: (L && L.teamNote) || '' }); }
  if (act === 'noteclear') { sheetState.text = ''; return confirmSheet(); }
  if (act === 'scrim') { if (e.target === el) closeSheet(); return; }
  if (act === 'close') return closeSheet();
  if (act === 'tab') return setTab(v);
  if (act === 'handoff' && P().active && P().active.block) {
    const p = P(), a = p.active, next = a.endLeg + 1;
    return openSheet({ kind: 'handoff', runner: next <= S.legs.length ? C.suggestRunner(next, D(), p.blocks, null) : null, ago: 0, estimate: false });
  }
  if (act === 'checkin') {
    const p = P(), a = p.active; if (!a || !a.block) return;
    const pr = p.proj[a.curLeg];
    return openSheet({ kind: 'checkin', leg: a.curLeg, runner: a.curLeg === a.leg && a.runner ? a.runner : (pr && (pr.runner || pr.suggested)), ago: 0, live: false });
  }
  if (act === 'update') return copyText(teamUpdate(), 'Update copied. Paste it into the group chat.');
  if (act === 'filladd') { const i = Number(v); const x = sheetState.rows[i]; sheetState.rows.splice(i + 1, 0, { leg: x.leg, runner: '', km: '', moving: '', extra: true }); return drawSheet(); }
  if (act === 'fillrm') { sheetState.rows.splice(Number(v), 1); return drawSheet(); }
  if (act === 'handoff' || act === 'split') {
    const p = P(), a = p.active; if (!a || a.block) return;
    if (act === 'split' && noSplit(a.leg)) return toast('Legs ' + S.legs[0].n + ' and ' + S.legs[S.legs.length - 1].n + ' must be run in full by one person.');
    const L = legOf(a.leg); const rem = Math.max(0, L.km - p.st[a.leg].kmDone);
    let km = rem;
    if (act === 'split') km = Math.min(rem, (Date.now() - a.start) / 1000 / C.paceFor(a.runner, D()));
    const next = act === 'split' ? a.leg : a.leg + 1;
    const blocks = p.blocks;
    return openSheet({ kind: act, km: Math.round(km * 100) / 100, runner: next <= S.legs.length ? C.suggestRunner(next, D(), blocks, a.runner) : null, ago: 0, estimate: false });
  }
  if (act === 'more') return openSheet({ kind: 'more' });
  if (act === 'pause') {
    const p = P(), a = p.active; if (!a) return;
    const L = legOf(a.leg); const rem = Math.max(0, L.km - p.st[a.leg].kmDone);
    return openSheet({ kind: 'pause', km: Math.round(Math.min(rem, (Date.now() - a.start) / 1000 / C.paceFor(a.runner, D())) * 100) / 100, legDone: false, ago: 0 });
  }
  if (act === 'start' || act === 'startat') {
    const p = P();
    const lastRun = S.runs.reduce((x, r) => (!x || (r.end || 0) > (x.end || 0) ? r : x), null);
    const leg = act === 'start' ? Number(v) : C.nextLeg(S.runs);
    return openSheet({ kind: 'start', leg, runner: C.suggestRunner(leg, D(), p.blocks, lastRun ? lastRun.runner : null), ago: 0, estimate: false });
  }
  if (act === 'pick') { sheetState.runner = v; if (sheetState.partner === v) sheetState.partner = null; return drawSheet(); }
  if (act === 'pickp') { sheetState.partner = v; return drawSheet(); }
  if (act === 'confirm') return confirmSheet();
  if (act === 'undo') return undo();
  if (act === 'askdel') { sheetState.confirmDel = true; return drawSheet(); }
  if (act === 'delrun') { const id = sheetState.run.id; closeSheet(); return save(() => api.del('runs', id), 'Run deleted'); }
  if (act === 'editrun') {
    const r = S.runs.find(x => x.id === v); if (!r) return;
    if (C.isBlock(r)) {
      if (!r.end) return toast('This block is still running. Tap "Leg ' + r.endLeg + ' done" on Live first.');
      const p = P(); const rows = [];
      for (let n = r.leg; n <= r.endLeg; n++) { const pr = p.proj[n] || {}; rows.push({ leg: n, runner: n === r.leg && r.runner ? r.runner : (pr.runner || pr.suggested || ''), km: (legOf(n) || {}).km || '', moving: '' }); }
      const fl = Number(S.cfg.ferryLeg) || 0;
      return openSheet({ kind: 'fill', run: r, rows, ferry: fl >= r.leg && fl < r.endLeg });
    }
    return openSheet({ kind: 'edit', run: { ...r, startS: toLocalInput(r.start), endS: toLocalInput(r.end), moving: r.movingSec ? C.fmtDur(r.movingSec) : '' } });
  }
  if (act === 'addrun') return openSheet({ kind: 'edit', run: { leg: 1, runner: S.runners[0] && S.runners[0].id, startS: toLocalInput(Date.now() - 3600000), endS: toLocalInput(Date.now()), legDone: true } });
  if (act === 'reset') return openSheet({ kind: 'reset' });
  if (act === 'blen') {
    const p = P(); const b = p.blocks[Number(v)];
    const len = Math.max(1, Math.min(5, b.len + Number(el.dataset.d)));
    const lens = { ...(S.cfg.blockLens || {}) }; if (len === 5) delete lens[v]; else lens[v] = len;
    return save(() => api.cfg({ blockLens: lens }));
  }
  if (act === 'bgroup') {
    const p = P(); const b = p.blocks[Number(v)];
    return save(() => api.cfg({ blockGroups: { ...(S.cfg.blockGroups || {}), [v]: b.group === 'A' ? 'B' : 'A' } }));
  }
  if (act === 'addrunner') {
    const order = S.runners.reduce((m, r) => Math.max(m, r.order || 0), 0) + 1;
    return save(() => api.add('runners', { name: 'New runner', group: v, paceSec: 300, order, active: true }), 'Runner added. Edit the name below.');
  }
  if (act === 'benchrunner') return save(() => api.upd('runners', v, { active: false }), 'Moved off this year\'s roster');
  if (act === 'unbench') return save(() => api.upd('runners', v, { active: true }), 'Back on the roster');
  if (act === 'rmrunner') return save(() => api.del('runners', v), 'Runner removed');
  if (act === 'csv') return copyText(csv(), 'Copied. Paste into Excel or Sheets.');
  if (act === 'csvsave') {
    if (SITE) {
      const url = URL.createObjectURL(new Blob([csv()], { type: 'text/csv' }));
      const a = document.createElement('a'); a.href = url; a.download = `runtomtl-${S.cfg.year || 'race'}-runs.csv`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return;
    }
    let dl = null; try { dl = window.claude ? await window.claude.use('downloads') : null; } catch (err) {}
    if (!dl) return toast('Saving files is not available here. Use Copy instead.');
    try { await dl.save({ filename: `runtomtl-${S.cfg.year || 'race'}-runs.csv`, data: csv() }); } catch (err) { /* viewer declined */ }
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (!S.canEdit && !(sheetState && el.closest('#sheet'))) return;
  if (el.dataset.fill != null && sheetState && sheetState.kind === 'fill') {
    sheetState.rows[Number(el.dataset.fill)][el.dataset.f] = el.value;
    if (el.dataset.f === 'runner') drawSheet();
    return;
  }
  if (el.dataset.sf && sheetState) {
    const k = el.dataset.sf, val = el.type === 'checkbox' ? el.checked : el.value;
    if (sheetState.kind === 'edit') sheetState.run[k] = val;
    else if (k === 'leg' && sheetState.kind === 'checkin') { sheetState.leg = Number(val); const p = C.project(D(), Date.now()); const pr = p.proj[sheetState.leg] || {}; sheetState.runner = pr.runner || pr.suggested || sheetState.runner; drawSheet(); }
    else if (k === 'leg') { sheetState.leg = Number(val); const p = C.project(D(), Date.now()); sheetState.runner = C.suggestRunner(sheetState.leg, D(), p.blocks, null); drawSheet(); }
    else { sheetState[k] = val; if (k === 'pair' || k === 'estimate') drawSheet(); }
    return;
  }
  if (el.dataset.cfg) {
    const k = el.dataset.cfg; let val = el.value;
    if (k === 'start') val = fromLocalInput(val);
    else if (['ferryLeg', 'ferryBoardMin', 'ferryCrossMin', 'ferryGapMin', 'paceAdjPct'].includes(k)) val = Number(val) || 0;
    return save(() => api.cfg({ [k]: val }), 'Saved');
  }
  if (el.dataset.act === 'plan') {
    const plan = { ...(S.cfg.plan || {}) }; if (el.value) plan[el.dataset.v] = el.value; else delete plan[el.dataset.v];
    return save(() => api.cfg({ plan }));
  }
  if (el.dataset.runner) {
    const f = el.dataset.f; let data;
    if (f === 'pace') { const p = C.parsePace(el.value); if (!p) { toast('Enter pace as min:sec, like 4:45'); return; } data = { paceSec: p }; }
    else if (f === 'name') { if (!el.value.trim()) return; data = { name: el.value.trim() }; }
    else data = { group: el.value };
    return save(() => api.upd('runners', el.dataset.runner, data), 'Saved');
  }
});
document.addEventListener('input', e => { const el = e.target; if (sheetState && el.dataset.sf && (sheetState.kind === 'note' || sheetState.kind === 'pin')) { sheetState[el.dataset.sf] = el.value; return; } if (el.dataset.fill != null && sheetState && sheetState.kind === 'fill') { sheetState.rows[Number(el.dataset.fill)][el.dataset.f] = el.value; return; } if (el.dataset.sf && sheetState && sheetState.kind === 'edit') sheetState.run[el.dataset.sf] = el.type === 'checkbox' ? el.checked : el.value; else if (el.dataset.sf && sheetState && el.dataset.sf === 'km') sheetState.km = el.value; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetState) closeSheet();
  if (e.key === 'Enter' && sheetState && sheetState.kind === 'pin' && e.target.id === 'pin-in') { e.preventDefault(); confirmSheet(); }
});

function setTab(t) {
  tab = t; try { localStorage.setItem('rtm.tab', t); } catch (e) {}
  render(true);
  window.scrollTo(0, 0);
}

// ---- render loop --------------------------------------------------------------
const EDIT_ACTS = new Set(['start', 'startat', 'handoff', 'split', 'more', 'checkin', 'undo', 'pause', 'editrun', 'addrun', 'reset', 'blen', 'bgroup', 'addrunner', 'rmrunner', 'benchrunner', 'unbench', 'note', 'noteclear']);
function applyGate(root) {
  const view = !S.canEdit;
  root.querySelectorAll('[data-act]').forEach(el => {
    const a = el.dataset.act;
    if (!EDIT_ACTS.has(a)) return;
    if (a === 'editrun') { el.disabled = view; return; }
    el.hidden = view;
  });
  root.querySelectorAll('input, select, textarea').forEach(el => { el.disabled = view; });
  root.querySelectorAll('.actions').forEach(box => { box.hidden = view && ![...box.children].some(c => !c.hidden && c.tagName === 'BUTTON'); });
}
let lastHtml = '';
function render(force) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  const banner = S.offline && !S.setupNeeded ? `<div class="banner">${SITE ? 'Lost connection to the race data. Showing the last update; retrying every 30 seconds.' : 'Not connected to the shared race data, so nothing here will sync. Open the page signed in to claude.ai.'}</div>` : '';
  const v = { live: liveView, plan: planView, team: teamView, log: logView, results: resultsView }[tab] || liveView;
  const r = v();
  const html = banner + r.html;
  header(r.P);
  const main = $('#main');
  const editing = main.contains(document.activeElement) && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (html !== lastHtml && (force || !editing)) { main.innerHTML = html; lastHtml = html; }
  applyGate(main);
  if (sheetState && !['edit', 'fill', 'copy', 'note', 'pin'].includes(sheetState.kind) && !$('#sheet').contains(document.activeElement)) drawSheet();
}
function tick() {
  const now = Date.now();
  document.querySelectorAll('[data-since]').forEach(el => { el.textContent = C.fmtDur((now - Number(el.dataset.since)) / 1000); });
}
setInterval(tick, 1000);
setInterval(() => render(), 20000);
render();
connect();
})();
